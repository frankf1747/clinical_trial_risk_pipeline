[project]
name = "ctrisk"
version = "0.1.0"
description = "Predict early termination of drug clinical trials"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ijson>=3.3",
    "lightgbm>=4.7.0",
    "pandas>=2.3.3",
    "pyspark==3.5.3",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scikit-learn>=1.9.1",
    "snowflake-connector-python[pandas]>=4.7.5",
]

[dependency-groups]
dev = [
    "duckdb>=1.5.5",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
